<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Family Secret Santa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      font-family: Calibri, Arial, sans-serif;
      background: radial-gradient(circle at top, #263858, #101a30 65%);
      color: #f8f5ed;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 35px 15px;
    }

    .gift {
      font-size: 48px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #c6cddd;
      font-size: 16px;
    }

    .panel {
      background: #ffffff;
      color: #17233b;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 40px #0004;
    }

    h2 {
      margin-top: 0;
      font-size: 23px;
    }

    p {
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d6dae2;
      border-radius: 10px;
      font-size: 16px;
      margin: 12px 0;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #bd9655;
      color: white;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background: #a57d40;
    }

    .main-button {
      width: 100%;
    }

    .person-card {
      border: 1px solid #e2e5eb;
      background: #fafafa;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .person-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .result {
      display: none;
      margin-top: 15px;
      padding: 18px;
      background: #edf5ef;
      border-radius: 12px;
      text-align: center;
    }

    .result-name {
      font-size: 25px;
      font-weight: bold;
      color: #28643e;
      margin-top: 8px;
    }

    .status {
      margin-top: 15px;
      font-size: 15px;
      color: #a13b36;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      color: #c6cddd;
      margin-top: 25px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="gift">🎁</div>

      <h1>Family Secret Santa</h1>

      <div class="subtitle">
        A little surprise for Christmas
      </div>
    </div>

    <div class="panel">

      <div id="login">

        <h2>Welcome!</h2>

        <p>
          Enter your personal access code to open your Secret Santa cards.
        </p>

        <form id="loginForm">

          <input
            id="accessCode"
            type="password"
            placeholder="Enter your access code"
            autocomplete="off"
            required
          >

          <button
            class="main-button"
            id="loginButton"
            type="submit"
          >
            Continue
          </button>

        </form>

      </div>

      <div id="content" class="hidden"></div>

      <div id="status" class="status" role="status"></div>

    </div>

    <div class="footer">
      Made with love for our family ❤️
    </div>

  </div>

  <script>
    // SUPABASE CONFIGURATION

    const SUPABASE_URL =
      "https://lwrsatgmvnsfjthqnoji.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_DyMTcdthXI4slB4t47SccA_tv58Qs5O";


    // HTML ELEMENTS

    const login = document.getElementById("login");
    const content = document.getElementById("content");
    const statusBox = document.getElementById("status");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const accessInput = document.getElementById("accessCode");


    // SESSION

    let accessToken = "";


    // DISPLAY MESSAGES

    function showStatus(message, error = true) {
      statusBox.textContent = message;

      statusBox.style.color = error
        ? "#a13b36"
        : "#28643e";
    }


    // CALL SUPABASE EDGE FUNCTIONS



     async function callFunction(name, data) {
  let response;

  try {
    response = await fetch(
      `${SUPABASE_URL}/functions/v1/${name}`,
      {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(data)
      }
    );

  } catch (error) {
    console.error("Network error:", error);
    throw new Error(
      "Cannot reach Supabase. Check the function URL and deployment."
    );
  }

  let result;

  try {
    result = await response.json();
  } catch {
    throw new Error(
      `Supabase returned an invalid response. HTTP ${response.status}`
    );
  }

  if (!response.ok) {
    throw new Error(
      result.error || `Request failed. HTTP ${response.status}`
    );
  }

  return result;
}

    // CREATE HTML ELEMENTS SAFELY

    function createElement(tag, className, text) {

      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }


    // REVEAL ONE PERSON'S CARD

    async function revealCard(person, button, resultBox) {

      button.disabled = true;

      button.textContent = "Opening your card...";

      showStatus("Opening your Secret Santa card...", false);

      try {

        const result = await callFunction(
          "family-reveal",
          {
            token: accessToken,
            participant_id: person.id
          }
        );


        if (!result.success || !result.recipient) {

          throw new Error("The recipient could not be found.");
        }


        resultBox.replaceChildren();


        resultBox.appendChild(
          createElement(
            "p",
            "",
            "You are buying a gift for:"
          )
        );


        resultBox.appendChild(
          createElement(
            "div",
            "result-name",
            result.recipient
          )
        );


        resultBox.style.display = "block";

        button.textContent = "Card opened";

        showStatus(
          "Your Secret Santa card is ready!",
          false
        );

      } catch (error) {

        button.disabled = false;

        button.textContent = "Reveal card";

        showStatus(error.message);
      }
    }


    // CREATE A PERSON'S CARD

    function createPersonCard(person, individual = false) {

      const card = createElement(
        "div",
        "person-card"
      );


      card.appendChild(
        createElement(
          "div",
          "person-name",
          person.name
        )
      );


      const button = createElement(
        "button",
        "",
        individual
          ? "Reveal my recipient"
          : "Reveal card"
      );


      const resultBox = createElement(
        "div",
        "result"
      );


      button.addEventListener("click", () => {

        revealCard(
          person,
          button,
          resultBox
        );

      });


      card.appendChild(button);

      card.appendChild(resultBox);

      return card;
    }


    // DISPLAY GROUP OR INDIVIDUAL ACCESS

    function displayAccess(data) {

      login.classList.add("hidden");

      content.classList.remove("hidden");

      content.replaceChildren();

      statusBox.textContent = "";


      // GROUP ACCESS

      if (data.type === "group") {

        content.appendChild(
          createElement(
            "h2",
            "",
            data.group.name
          )
        );


        content.appendChild(
          createElement(
            "p",
            "",
            "Choose one person's card at a time."
          )
        );


        if (!Array.isArray(data.participants)) {

          throw new Error("Invalid participant list.");
        }


        data.participants.forEach(person => {

          content.appendChild(
            createPersonCard(person)
          );

        });

      }


      // INDIVIDUAL ACCESS

      else if (data.type === "individual") {

        content.appendChild(
          createElement(
            "h2",
            "",
            "Your Secret Santa card"
          )
        );


        content.appendChild(
          createElement(
            "p",
            "",
            "Your card is ready. Open it to discover your recipient."
          )
        );


        content.appendChild(
          createPersonCard(
            data.participant,
            true
          )
        );

      }

      else {

        throw new Error("Unknown access type.");
      }
    }


    // CHECK ACCESS CODE

    async function loginWithToken(token) {

      if (!token) {

        showStatus("Please enter your access code.");

        return;
      }


      showStatus(
        "Checking your access code...",
        false
      );

      loginButton.disabled = true;


      try {

        const data = await callFunction(
          "family-access",
          { token }
        );


        accessToken = token;

        sessionStorage.setItem(
          "secretSantaToken",
          token
        );


        displayAccess(data);

        accessInput.value = "";

      } catch (error) {

        showStatus(error.message);

        login.classList.remove("hidden");

        content.classList.add("hidden");

        if (error.message === "Invalid access code") {

          sessionStorage.removeItem(
            "secretSantaToken"
          );

          accessToken = "";
        }

      } finally {

        loginButton.disabled = false;
      }
    }


    // LOGIN FORM

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        const token = accessInput.value.trim();

        await loginWithToken(token);

      }
    );


    // READ ACCESS CODE FROM PERSONAL LINK

    const params = new URLSearchParams(
      window.location.search
    );

    const linkToken =
      params.get("code") ||
      params.get("token");


    if (linkToken) {

      sessionStorage.setItem(
        "secretSantaToken",
        linkToken
      );


      // Remove code from visible address

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }


    // RESTORE PREVIOUS SESSION

    const savedToken =
      linkToken ||
      sessionStorage.getItem("secretSantaToken");


    if (savedToken) {

      loginWithToken(savedToken);
    }

  </script>

</body>
</html>
