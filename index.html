<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Secret Santa</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101b18;
    color: white;
    text-align: center;
}

header {
    padding: 25px 15px;
}

.logo {
    font-size: 35px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    color: #c3d1c9;
    font-size: 15px;
}

.container {
    max-width: 450px;
    margin: 35px auto;
    padding: 20px;
}

.card {
    background: #1c3029;
    border: 1px solid #355447;
    border-radius: 18px;
    padding: 30px 20px;
    margin-top: 25px;
}

.card h2 {
    font-size: 23px;
}

.description {
    color: #c3d1c9;
    line-height: 1.6;
}

.gift {
    font-size: 75px;
    margin: 20px;
}

button {
    background: #d7ad64;
    color: #17221d;
    border: none;
    border-radius: 10px;
    padding: 15px 25px;
    font-size: 16px;
    font-weight: bold;
    width: 100%;
    margin-top: 20px;
}

button:disabled {
    opacity: 0.6;
}

footer {
    color: #82968b;
    font-size: 12px;
    padding: 30px;
}
</style>
</head>

<body>

<header>
    <div class="logo">🎄</div>
    <h1>Family Secret Santa</h1>
    <p class="subtitle">A little surprise for someone special.</p>
</header>

<div class="container">

    <div class="card">
        <div class="gift">🎁</div>

        <h2>Christmas is coming!</h2>

        <p class="description">
            Welcome to our family Secret Santa.
            Get ready to discover the person
            you will surprise this Christmas.
        </p>

        <button disabled>
            Draw coming soon
        </button>
    </div>

</div>

<footer>
    Family Secret Santa · Christmas 2026
</footer>

</body>
</html>
