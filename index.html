
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Secret Santa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #1c293b;
      padding: 30px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin: 5px 0 10px;
    }

    .subtitle {
      color: #bac5d5;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 9px;
      color: #dce5f2;
    }

    select {
      width: 100%;
      padding: 15px;
      border: 1px solid #40516a;
      border-radius: 10px;
      background: #101827;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #d7a84b;
      color: #182233;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 22px 15px;
      background: #263951;
      border: 1px solid #d7a84b;
      border-radius: 14px;
    }

    #recipient {
      color: #f2c66d;
      font-size: 25px;
      font-weight: bold;
      overflow-wrap: anywhere;
      margin: 12px 0;
    }

    #status {
      color: #bac5d5;
      margin-top: 18px;
      line-height: 1.5;
      min-height: 24px;
    }

    #remaining {
      color: #f2c66d;
      margin-top: 12px;
    }

    .hide-button {
      margin-top: 12px;
      background: #40516a;
      color: white;
      font-size: 14px;
    }

    .note {
      color: #9eacbf;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">🎄</div>
    <h1>Family Secret Santa</h1>

    <p class="subtitle">
      Choisis ton nom et tire ta carte.
      Chaque carte ne peut être tirée qu'une seule fois.
    </p>

    <label for="participant">Sélectionne ton nom :</label>

    <select id="participant">
      <option value="">Choisir un nom</option>
      <option value="Thelma">Thelma (4 tirages)</option>
      <option value="Fluvia">Fluvia (2 tirages)</option>
      <option value="Maman Odette">Maman Odette</option>
      <option value="William">William</option>
      <option value="Aurore">Aurore</option>
      <option value="Violette">Violette</option>
      <option value="Nada">Nada</option>
      <option value="Nika">Nika</option>
      <option value="Alimasi">Alimasi</option>
      <option value="Eloise">Eloise</option>
      <option value="Sharon">Sharon</option>
      <option value="Karim">Karim</option>
    </select>

    <button id="drawButton" disabled>
      Tirer une carte
    </button>

    <div id="result">
      <p>Tu as tiré :</p>
      <div id="recipient"></div>
      <button id="hideButton" class="hide-button">
        Cacher le résultat
      </button>
    </div>

    <div id="remaining"></div>
    <div id="status"></div>

    <p class="note">
      Une personne à la fois. Après chaque tirage,
      passe le téléphone à la personne suivante.
      Les cartes utilisées sont retirées pour tout le monde.
    </p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://lwrsatgmvnsfjthqnoji.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_DyMTcdthXI4slB4t47SccA_tv58Qs5O";

    const participantSelect =
      document.getElementById("participant");

    const drawButton =
      document.getElementById("drawButton");

    const resultBox =
      document.getElementById("result");

    const recipientBox =
      document.getElementById("recipient");

    const statusBox =
      document.getElementById("status");

    const remainingBox =
      document.getElementById("remaining");

    const hideButton =
      document.getElementById("hideButton");

    let drawing = false;

    participantSelect.addEventListener("change", () => {
      resultBox.style.display = "none";
      recipientBox.textContent = "";
      remainingBox.textContent = "";
      statusBox.textContent = "";

      drawButton.disabled = !participantSelect.value;
      drawButton.textContent = "Tirer une carte";
    });

    hideButton.addEventListener("click", () => {
      resultBox.style.display = "none";
      recipientBox.textContent = "";
    });

    drawButton.addEventListener("click", async () => {
      const participantName = participantSelect.value;

      if (!participantName || drawing) return;

      drawing = true;
      drawButton.disabled = true;
      drawButton.textContent = "Tirage en cours...";
      statusBox.textContent = "Connexion au tirage...";
      remainingBox.textContent = "";
      resultBox.style.display = "none";

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/family-reveal`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
              participant_name: participantName
            })
          }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.error || "Le tirage n'a pas fonctionné."
          );
        }

        recipientBox.textContent = data.recipient;
        resultBox.style.display = "block";

        if (typeof data.remaining === "number") {
          if (data.remaining > 0) {
            remainingBox.textContent =
              `${data.remaining} tirage(s) restant(s) pour ce choix.`;
          } else {
            remainingBox.textContent =
              "Tous les tirages de ce choix sont terminés.";
          }
        }

        statusBox.textContent = "Tirage réussi !";

        if (data.remaining === 0) {
          drawButton.textContent = "Tirage terminé";
          drawButton.disabled = true;
        } else {
          drawButton.textContent = "Tirer une autre carte";
          drawButton.disabled = false;
        }

      } catch (error) {
        statusBox.textContent =
          error.message || "Une erreur est survenue.";

        drawButton.textContent = "Réessayer";
        drawButton.disabled = false;

      } finally {
        drawing = false;
      }
    });
  </script>
</body>
</html>
