
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Secret Santa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #1c293b;
      padding: 30px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .icon {
      font-size: 52px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      margin: 5px 0 10px;
    }

    .subtitle {
      color: #bac5d5;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 9px;
      color: #dce5f2;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #40516a;
      border-radius: 10px;
      background: #101827;
      color: white;
      font-size: 22px;
      text-align: center;
      letter-spacing: 8px;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #d7a84b;
      color: #182233;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #drawButton {
      margin-top: 12px;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 22px 15px;
      background: #263951;
      border: 1px solid #d7a84b;
      border-radius: 14px;
    }

    #recipient {
      color: #f2c66d;
      font-size: 25px;
      font-weight: bold;
      overflow-wrap: anywhere;
      margin: 12px 0;
    }

    #accessInfo {
      display: none;
      margin-top: 18px;
      padding: 14px;
      background: #263951;
      border-radius: 10px;
      color: #f2c66d;
    }

    #status {
      color: #bac5d5;
      margin-top: 18px;
      line-height: 1.5;
      min-height: 24px;
      overflow-wrap: anywhere;
    }

    #remaining {
      color: #f2c66d;
      margin-top: 12px;
    }

    .secondary-button {
      margin-top: 12px;
      background: #40516a;
      color: white;
      font-size: 14px;
    }

    .note {
      color: #9eacbf;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 24px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon">🎄</div>
    <h1>Family Secret Santa</h1>

    <p class="subtitle">
      Entre ton code privé pour accéder à ton tirage.
      Chaque carte ne peut être tirée qu'une seule fois.
    </p>

    <section id="loginSection">
      <label for="accessCode">Ton code privé :</label>

      <input
        id="accessCode"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        autocomplete="off"
        placeholder="••••"
        aria-label="Code privé à quatre chiffres"
      >

      <button id="validateButton">
        Valider mon code
      </button>
    </section>

    <div id="accessInfo"></div>

    <button id="drawButton" hidden disabled>
      Tirer ma carte
    </button>

    <div id="result">
      <p>Tu as tiré :</p>
      <div id="recipient"></div>

      <button id="hideButton" class="secondary-button">
        Cacher le résultat
      </button>
    </div>

    <div id="remaining"></div>
    <div id="status" role="status" aria-live="polite"></div>

    <button id="changeCodeButton" class="secondary-button" hidden>
      Utiliser un autre code
    </button>

    <p class="note">
      Garde ton code privé. Ne le partage pas avec les autres.
      Quand tu as terminé tes tirages, préviens Karim.
      Les cartes utilisées sont retirées pour tout le monde.
    </p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://lwrsatgmvnsfjthqnoji.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_DyMTcdthXI4slB4t47SccA_tv58Qs5O";

    const accessCodeInput = document.getElementById("accessCode");
    const validateButton = document.getElementById("validateButton");
    const drawButton = document.getElementById("drawButton");
    const resultBox = document.getElementById("result");
    const recipientBox = document.getElementById("recipient");
    const statusBox = document.getElementById("status");
    const remainingBox = document.getElementById("remaining");
    const accessInfo = document.getElementById("accessInfo");
    const hideButton = document.getElementById("hideButton");
    const changeCodeButton = document.getElementById("changeCodeButton");
    const loginSection = document.getElementById("loginSection");

    let currentToken = "";
    let drawing = false;
    let drawComplete = false;

    async function callFunction(functionName, body) {
      const response = await fetch(
        `${SUPABASE_URL}/functions/v1/${functionName}`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify(body)
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Une erreur est survenue.");
      }

      return data;
    }

    validateButton.addEventListener("click", async () => {
      const token = accessCodeInput.value.trim();

      if (!/^\d{4}$/.test(token)) {
        statusBox.textContent = "Entre un code valide de 4 chiffres.";
        return;
      }

      validateButton.disabled = true;
      validateButton.textContent = "Vérification...";
      statusBox.textContent = "Vérification du code...";
      accessInfo.style.display = "none";

      try {
        const data = await callFunction("family-acess", { token });

        if (!data.ok) {
          throw new Error(data.error || "Code invalide.");
        }

        currentToken = token;

        let accessName = "";

        if (data.type === "group" && data.group) {
          accessName = data.group.name;
        } else if (data.type === "individual" && data.participant) {
          accessName = data.participant.name;
        } else {
          throw new Error("Réponse de sécurité incorrecte.");
        }

        loginSection.hidden = true;
        accessInfo.textContent = `Code accepté. Accès autorisé : ${accessName}`;
        accessInfo.style.display = "block";

        drawButton.hidden = false;
        drawButton.disabled = false;
        drawButton.textContent = "Tirer ma carte";

        changeCodeButton.hidden = false;
        statusBox.textContent = "Tu peux maintenant effectuer ton tirage.";

      } catch (error) {
        currentToken = "";
        statusBox.textContent = error.message || "Impossible de vérifier le code.";
        accessCodeInput.value = "";
        accessCodeInput.focus();

      } finally {
        validateButton.disabled = false;
        validateButton.textContent = "Valider mon code";
      }
    });

    accessCodeInput.addEventListener("input", () => {
      accessCodeInput.value = accessCodeInput.value
        .replace(/\D/g, "")
        .slice(0, 4);
    });

    accessCodeInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        validateButton.click();
      }
    });

    hideButton.addEventListener("click", () => {
      resultBox.style.display = "none";
      recipientBox.textContent = "";
    });

    changeCodeButton.addEventListener("click", () => {
      currentToken = "";
      drawing = false;
      drawComplete = false;

      loginSection.hidden = false;
      accessInfo.style.display = "none";
      drawButton.hidden = true;
      drawButton.disabled = true;
      changeCodeButton.hidden = true;

      resultBox.style.display = "none";
      recipientBox.textContent = "";
      remainingBox.textContent = "";
      statusBox.textContent = "";

      accessCodeInput.value = "";
      accessCodeInput.focus();
    });

    drawButton.addEventListener("click", async () => {
      if (!currentToken || drawing || drawComplete) return;

      drawing = true;
      drawButton.disabled = true;
      drawButton.textContent = "Tirage en cours...";
      statusBox.textContent = "Connexion au tirage...";
      remainingBox.textContent = "";
      resultBox.style.display = "none";

      try {
        const data = await callFunction("family-reveal", {
          token: currentToken
        });

        if (!data.success) {
          throw new Error(data.error || "Le tirage n'a pas fonctionné.");
        }

        recipientBox.textContent = data.recipient;
        resultBox.style.display = "block";

        if (typeof data.remaining === "number") {
          if (data.remaining > 0) {
            remainingBox.textContent =
              `${data.remaining} tirage(s) restant(s).`;
          } else {
            remainingBox.textContent =
              "Tous les tirages de cet accès sont terminés.";
          }
        }

        statusBox.textContent = "Tirage réussi !";

        if (data.remaining === 0) {
          drawComplete = true;
          drawButton.textContent = "Tirage terminé";
          drawButton.disabled = true;
        } else {
          drawButton.textContent = "Tirer une autre carte";
          drawButton.disabled = false;
        }

      } catch (error) {
        statusBox.textContent =
          error.message || "Une erreur est survenue.";

        if (
          error.message.includes("already been drawn") ||
          error.message.includes("All cards for this group")
        ) {
          drawComplete = true;
          drawButton.textContent = "Tirage terminé";
          drawButton.disabled = true;
        } else {
          drawButton.textContent = "Réessayer";
          drawButton.disabled = false;
        }

      } finally {
        drawing = false;
      }
    });
  </script>
</body>
</html>
